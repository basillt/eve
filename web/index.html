<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eve</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%2306070f%27/%3E%3Cpath d=%27M23 11H11v10h12M11 16h9%27 fill=%27none%27 stroke=%27%2319e3ff%27 stroke-width=%273%27/%3E%3Ccircle cx=%2725%27 cy=%277%27 r=%272.5%27 fill=%27%23ff2bd6%27/%3E%3C/svg%3E">
<script type="importmap">{"imports":{"three":"/web/vendor/three.module.min.js"}}</script>
<style>
:root{
  --ink:#1c2340; --ink-soft:#56607f; --line:#d5dcea;
  --paper:#f4f7fc; --card:#ffffff;
  --flame:#ffc533; --flame-deep:#f59a1b; --glass:#fff1bf;
  --sea:#11767c; --sea-deep:#0c5a5f;
  --sky:#a9dcec; --sky-low:#d9f0e6; --night:#1a2552; --night-low:#2c3a78;
  --bad:#b3261e;
  --r:14px;
  font-family:"Noto Kufi Arabic","Segoe UI","Noto Sans Arabic",Tahoma,system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-size:16px;line-height:1.7}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--flame-deep);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(300px,38%) 1fr;height:100dvh}

/* ---------- the stage: where the brain lives ---------- */
.stage{position:relative;overflow:hidden;background:radial-gradient(70% 55% at 50% 42%,#1c1046 0%,#0b0b22 55%,#05060d 100%);
  border-inline-end:3px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  transition:background 1.2s}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 55% at 50% 42%,#0e0b2e 0%,#04040b 75%);opacity:0;transition:opacity 1.4s}
.asleep .stage::before{opacity:1}
.who{position:relative;z-index:2;text-align:center;padding:0 16px 22px;color:#fff}
.asleep .who{color:#eef1ff}
.who h1{margin:0;font-size:1.75rem;line-height:1.3}
.who p{margin:2px 0 0;font-size:.95rem;opacity:.85}
.status{position:relative;z-index:2;min-height:1.7em;font-size:.95rem;margin-bottom:6px;color:#fff}
.asleep .status{color:#eef1ff}
/* ---------- the working side ---------- */
.side{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
.local{display:inline-flex;align-items:center;gap:6px;background:#e3f3ee;color:var(--sea-deep);border:1.5px solid var(--sea);
  border-radius:999px;padding:2px 12px;font-size:.85rem;font-weight:600;white-space:nowrap}
.tabs{display:flex;gap:2px;margin-inline-start:auto;flex-wrap:wrap}
.tabs button{background:none;border:0;padding:6px 12px;border-radius:10px;color:var(--ink-soft);font-weight:600}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
.view{flex:1;min-height:0;overflow:auto;display:none;padding:22px clamp(16px,4vw,44px)}
.view.on{display:block}
#v-chat.on{display:flex;flex-direction:column;padding:0}
.view h2{font-size:1.3rem;margin:0 0 4px}
.view .lead{color:var(--ink-soft);margin:0 0 18px;max-width:60ch}

.log{flex:1;overflow:auto;padding:22px clamp(16px,4vw,44px);display:flex;flex-direction:column;gap:14px}
.empty{margin:auto;text-align:center;color:var(--ink-soft);max-width:40ch}
.msg{max-width:min(68ch,88%);display:flex;flex-direction:column;gap:4px}
.msg .b{padding:10px 16px;border-radius:var(--r);white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-start}
.msg.user .b{background:var(--sea);color:#fff;border-end-start-radius:4px}
.msg.bot{align-self:flex-end}
.msg.bot .b{background:var(--card);border:1.5px solid var(--ink);border-end-end-radius:4px}
.acts{display:flex;gap:6px;align-items:center;font-size:.85rem;flex-wrap:wrap}
.acts button{background:none;border:1px solid var(--line);border-radius:999px;padding:1px 12px;color:var(--ink-soft)}
.acts button:hover{border-color:var(--ink);color:var(--ink)}
.acts .saved{color:var(--sea-deep);font-weight:600}
.fix{display:flex;flex-direction:column;gap:6px;width:100%}
.fix textarea{min-height:76px}
.composer{display:flex;gap:10px;padding:12px clamp(16px,4vw,44px) 16px;border-top:1px solid var(--line);background:var(--card)}
textarea,input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;background:#fff;resize:vertical}
.composer textarea{resize:none;height:50px;max-height:160px}
.btn{background:var(--ink);color:#fff;border:0;border-radius:12px;padding:8px 18px;font-weight:700;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:default}
.btn.flame{background:var(--flame);color:var(--ink);border:2px solid var(--ink)}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--ink)}
.btn.danger{background:none;color:var(--bad);border:1.5px solid var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:16px;max-width:760px}
.panel h3{margin:0 0 8px;font-size:1.05rem}
.bar{display:flex;height:30px;border:2px solid var(--ink);border-radius:9px;overflow:hidden;background:#e7ebf5}
.bar span{display:block;height:100%}
.bar .k{background:var(--ink)} .bar .h{background:var(--flame)} .bar .c{background:#ffe59c}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem;margin-top:8px;color:var(--ink-soft)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px;border:1px solid var(--ink)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:0}
.facts div{margin:0}
.facts dt{font-size:.85rem;color:var(--ink-soft)}
.facts dd{margin:0;font-size:1.35rem;font-weight:700;direction:ltr;text-align:end}
.note{font-size:.9rem;color:var(--ink-soft);margin:8px 0 0}
ul.plain{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
ul.plain li{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:8px}
ul.plain li span{overflow-wrap:anywhere}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;max-width:760px}
.pcard{border:2px solid var(--line);border-radius:var(--r);padding:14px;background:var(--card);text-align:start}
.pcard[aria-pressed="true"]{border-color:var(--ink);box-shadow:4px 4px 0 var(--flame)}
.pcard b{display:block;font-size:1.1rem}
.pcard small{color:var(--ink-soft)}
.tag{display:inline-block;font-size:.78rem;border:1px solid var(--sea);color:var(--sea-deep);border-radius:999px;padding:0 9px;margin-top:6px}
.err{color:var(--bad)}

/* morning card */
.morning{position:absolute;z-index:5;inset-inline:14px;top:14px;background:#fffdf3;border:2.5px solid var(--ink);border-radius:18px;
  padding:16px 18px;box-shadow:6px 6px 0 var(--flame);display:none;max-height:calc(100% - 28px);overflow:auto;color:var(--ink)}
.morning.on{display:block;animation:rise .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes rise{from{transform:translateY(-20px) scale(.96);opacity:0}}
.morning h2{margin:0 0 6px;font-size:1.25rem}
.morning ul{margin:0 0 12px;padding-inline-start:20px}

/* the brain: the default face of the assistant */
#brain3d{position:absolute;inset:0;width:100%;height:100%;display:none;z-index:1;cursor:grab}
#brain3d:active{cursor:grabbing}
.isbrain #brain3d{display:block}
.isbrain .stage{background:radial-gradient(120% 90% at 50% 42%,#24316b 0%,#141c44 55%,#0d1331 100%)}
.isbrain .stage::before{background:radial-gradient(120% 90% at 50% 42%,#1a1f4a 0%,#0b0f29 70%)}
.isbrain .who,.isbrain .status{color:#fff;transition:none;text-shadow:0 1px 4px rgba(5,8,25,.7)}
.isbrain .who p{color:#b9c2e6}
.langbtn{margin-inline-start:auto;background:none;border:1.5px solid var(--line);border-radius:999px;padding:2px 12px;color:var(--ink-soft);font:inherit;font-size:.85rem;cursor:pointer}
.langbtn:hover{border-color:var(--ink);color:var(--ink)}

/* character designer */
.editor{max-width:760px}
.editor .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.editor label.f{display:flex;flex-direction:column;gap:4px;font-size:.92rem;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:2px 12px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.ed-actions{position:sticky;bottom:-22px;background:var(--card);padding:12px 0;margin-top:14px;border-top:1px solid var(--line)}
@media (max-width:600px){.editor .grid{grid-template-columns:1fr}}

@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:34dvh 1fr}
  .stage{border-inline-end:0;border-bottom:3px solid var(--ink);flex-direction:row;justify-content:center;gap:8px;padding:8px 12px}
  .who{padding:0;text-align:start}.who h1{font-size:1.35rem}
  .status{position:absolute;bottom:6px;inset-inline-start:12px;margin:0;font-size:.85rem}
  .typing .app{grid-template-rows:18dvh 1fr}
  .typing .who p{display:none}
  .isbrain .stage{flex-direction:column;justify-content:flex-end;align-items:flex-start}
  .isbrain .who{position:relative;z-index:2;text-align:start;padding:0 4px 4px}
  .top{padding:8px 12px}.tabs{margin-inline-start:0;width:100%;overflow-x:auto;flex-wrap:nowrap}
}
@media (prefers-reduced-motion:reduce){
  .morning.on{animation:none!important;transition:none!important}
}

/* ================= cyberpunk theme (night city HUD) =================
   VOICE: a calm, modern HUD; neon is used for meaning, not decoration
   COLOUR: void #06070f, glass panels, cyan = the assistant, magenta = you, yellow = action
   SHAPE: cut corners, 1px neon edges, faint grid and scanlines on the stage */
:root{
  --void:#06070f; --deep:#0a0d1c; --glass:rgba(16,22,44,.72); --glass-hi:rgba(24,32,62,.85);
  --ink:#e6f1ff; --ink-soft:#8ea3c7; --line:#1f2b4d;
  --cyan:#19e3ff; --cyan-dim:rgba(25,227,255,.35); --mag:#ff2bd6; --mag-dim:rgba(255,43,214,.35); --volt:#f6ff4a;
  --bad:#ff4d6d; --cut:10px;
  --mono:"JetBrains Mono","Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace;
}
body{background:var(--void);color:var(--ink);
  background-image:linear-gradient(rgba(25,227,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(25,227,255,.035) 1px,transparent 1px),
    radial-gradient(60% 50% at 100% 0%,rgba(255,43,214,.10),transparent 70%),radial-gradient(50% 40% at 0% 100%,rgba(25,227,255,.08),transparent 70%);
  background-size:32px 32px,32px 32px,auto,auto}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;box-shadow:0 0 0 4px rgba(25,227,255,.18)}
::selection{background:var(--mag);color:#fff}

/* stage */
.stage{border-inline-end:1px solid var(--cyan-dim);box-shadow:inset -1px 0 0 rgba(25,227,255,.08)}
.isbrain .stage{background:radial-gradient(70% 55% at 50% 42%,#1c1046 0%,#0b0b22 55%,#05060d 100%)}
.isbrain .stage::before{background:radial-gradient(70% 55% at 50% 42%,#0e0b2e 0%,#04040b 75%)}
.isbrain .stage::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:repeating-linear-gradient(rgba(255,255,255,.025) 0 1px,transparent 1px 3px),
    linear-gradient(var(--cyan),var(--cyan)) top 14px left 14px/22px 2px no-repeat,linear-gradient(var(--cyan),var(--cyan)) top 14px left 14px/2px 22px no-repeat,
    linear-gradient(var(--mag),var(--mag)) top 14px right 14px/22px 2px no-repeat,linear-gradient(var(--mag),var(--mag)) top 14px right 14px/2px 22px no-repeat}
.isbrain .who h1{color:#fff;text-shadow:0 0 18px rgba(25,227,255,.55)}
.isbrain .who p{color:var(--ink-soft)}
.isbrain .status{color:var(--volt);text-shadow:0 0 10px rgba(246,255,74,.45)}

/* top bar and tabs */
.top{background:rgba(8,11,24,.9);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.local{background:rgba(25,227,255,.08);color:var(--cyan);border:1px solid var(--cyan-dim);border-radius:0;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
#mode{color:var(--ink-soft)}
.langbtn{border-radius:0;border:1px solid var(--line);color:var(--ink-soft)}
.langbtn:hover{border-color:var(--mag);color:var(--mag)}
.tabs button{border-radius:0;color:var(--ink-soft);position:relative}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{background:none;color:var(--cyan);text-shadow:0 0 12px rgba(25,227,255,.6)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;inset-inline:10px;bottom:-2px;height:2px;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.view h2{color:#fff;letter-spacing:.01em}
.view h2::after{content:"";display:block;width:44px;height:2px;margin-top:6px;background:linear-gradient(90deg,var(--cyan),var(--mag))}
.view .lead,.note{color:var(--ink-soft)}

/* chat */
.empty{color:var(--ink-soft)}
.msg .b{border-radius:0}
.msg.user .b{background:linear-gradient(135deg,rgba(255,43,214,.20),rgba(255,43,214,.08));color:#fff;border:1px solid var(--mag-dim);
  clip-path:polygon(var(--cut) 0,100% 0,100% 100%,0 100%,0 var(--cut))}
.msg.bot .b{background:var(--glass);border:1px solid var(--line);border-inline-start:2px solid var(--cyan);color:var(--ink);
  box-shadow:0 0 24px rgba(25,227,255,.06);clip-path:polygon(0 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%)}
.acts button{border-radius:0;border:1px solid var(--line);color:var(--ink-soft);background:rgba(10,13,28,.6)}
.acts button:hover{border-color:var(--cyan);color:var(--cyan)}
.acts .saved{color:var(--cyan)}
.composer{background:rgba(8,11,24,.92);border-top:1px solid var(--line)}
textarea,input[type=text]{background:var(--deep);border:1px solid var(--line);border-radius:0;color:var(--ink)}
textarea::placeholder,input::placeholder{color:#5d6f94}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 18px rgba(25,227,255,.25)}

/* buttons */
.btn{background:var(--cyan);color:#041018;border-radius:0;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  transition:box-shadow .2s,filter .2s}
.btn:hover:not(:disabled){filter:brightness(1.12);box-shadow:0 0 18px rgba(25,227,255,.5)}
.btn.flame{background:var(--volt);color:#0b0c05;border:0}
.btn.flame:hover:not(:disabled){box-shadow:0 0 18px rgba(246,255,74,.5)}
.btn.ghost{background:transparent;color:var(--cyan);border:1px solid var(--cyan-dim)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(255,77,109,.6)}
.chip{background:var(--deep);border:1px solid var(--line);border-radius:0;color:var(--ink)}
.chip:hover{border-color:var(--cyan)}
.chip[aria-pressed="true"]{background:rgba(25,227,255,.14);border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 12px rgba(25,227,255,.25)}

/* panels, facts, memory, cards */
.panel{background:var(--glass);border:1px solid var(--line);border-radius:0;position:relative;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.panel h3{color:#fff}
.facts dt{color:var(--ink-soft)}
.facts dd{font-weight:700;font-variant-numeric:tabular-nums;color:var(--cyan);text-shadow:0 0 10px rgba(25,227,255,.35);font-size:1.15rem}
ul.plain li{border-bottom:1px solid var(--line)}
.bar{border:1px solid var(--line);border-radius:0;background:var(--deep)}
.bar .k{background:#3a4a78} .bar .h{background:var(--cyan)} .bar .c{background:var(--mag)}
.legend i{border-radius:0;border:0}
.pcard{background:var(--glass);border:1px solid var(--line);border-radius:0}
.pcard[aria-pressed="true"]{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 24px rgba(25,227,255,.18)}
.pcard small{color:var(--ink-soft)}
.tag{border-radius:0;border:1px solid var(--mag-dim);color:var(--mag)}
.err{color:var(--bad)}
.editor fieldset,.ed-actions{border-color:var(--line)}
.ed-actions{background:var(--deep)}

/* morning card */
.morning{background:rgba(10,12,30,.94);color:var(--ink);border:1px solid var(--mag);border-radius:0;
  box-shadow:0 0 0 1px rgba(255,43,214,.25),0 0 40px rgba(255,43,214,.25);backdrop-filter:blur(10px);
  clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px))}
.morning h2{color:#fff;text-shadow:0 0 14px rgba(255,43,214,.6)}
.morning li::marker{color:var(--mag)}

/* left-to-right: you on the right, the assistant on the left */
[dir="ltr"] .msg.user{align-self:flex-end}
[dir="ltr"] .msg.bot{align-self:flex-start}

/* brain age under the name */
.quitmsg{position:fixed;inset:0;display:grid;place-items:center;margin:0;font-size:1.3rem;color:var(--ink);text-align:center;padding:24px}
.who .age.done,.isbrain .who .age.done{color:var(--volt);text-shadow:0 0 12px rgba(246,255,74,.5)}
.who .age,.isbrain .who .age{margin:6px 0 0;font-size:.8rem;color:var(--cyan);opacity:.85;letter-spacing:.02em}
.asleep .who .age{color:#9fb0ff}
/* files in the chat */
.attach{background:none;border:1px solid var(--line);color:var(--ink-soft);width:50px;height:50px;display:grid;place-items:center;flex:none;cursor:pointer}
.attach:hover{border-color:var(--cyan);color:var(--cyan)}
.attached{display:flex;flex-wrap:wrap;gap:8px;padding:8px clamp(16px,4vw,44px) 0;background:rgba(8,11,24,.92);border-top:1px solid var(--line)}
.fchip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--cyan-dim);background:rgba(25,227,255,.08);color:var(--ink);padding:3px 4px 3px 10px;font-size:.85rem;max-width:100%}
.fchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:28ch}
.fchip button{background:none;border:0;color:var(--ink-soft);font-size:1.1rem;line-height:1;padding:0 6px;cursor:pointer}
.fchip button:hover{color:var(--bad)}
.src{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.8rem;color:var(--ink-soft)}
.src .fchip{padding:1px 8px;font-size:.78rem;border-color:var(--line)}
.dropping .log,.drop.dropping{outline:2px dashed var(--cyan);outline-offset:-10px;background:rgba(25,227,255,.05)}
.drop{border-style:dashed;text-align:center;padding:26px 18px}
#filelist .meta{display:block;color:var(--ink-soft);font-size:.82rem}
#filelist .row{gap:6px;flex-wrap:nowrap}
/* mixed Arabic / English text keeps its own direction */
.fchip span,.src .fchip,#m-list li,.picks span,ul.plain li span,#filelist b{unicode-bidi:plaintext}
/* sharing the morning card */
.morning{max-height:calc(100% - 28px);overflow:auto}
.picks{display:flex;flex-direction:column;gap:6px;margin:0 0 10px}
.picks label{display:flex;gap:8px;align-items:flex-start;cursor:pointer;font-size:.92rem}
.picks input{accent-color:var(--mag);margin-top:5px}
#m-canvas{width:100%;max-width:300px;height:auto;display:block;margin:0 auto 12px;border:1px solid var(--line)}

/* image thumbnails on attach chips, sources and the files list */
.thumb{width:26px;height:26px;object-fit:cover;border:1px solid var(--line);vertical-align:middle;margin-inline-end:2px}
.src .thumb{width:22px;height:22px}
.thumb.big{width:54px;height:54px;flex:none;margin-inline-end:10px}
#filelist li{align-items:center}

/* first start: setup progress over the working side */
.side{position:relative}
.setup{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:24px;background:var(--void);
  background-image:linear-gradient(rgba(25,227,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(25,227,255,.035) 1px,transparent 1px);background-size:32px 32px}
.setup-box{width:min(560px,100%)}
.steps{list-style:none;padding:0;margin:22px 0 18px;display:flex;flex-direction:column;gap:12px}
.steps li{display:flex;gap:12px;align-items:flex-start;color:var(--ink-soft);font-size:1rem}
.steps li::before{content:"";flex:none;width:14px;height:14px;margin-top:6px;border:2px solid var(--line);transform:rotate(45deg)}
.steps li.now{color:#fff;font-weight:600}
.steps li.now::before{border-color:var(--volt);background:var(--volt);box-shadow:0 0 12px rgba(246,255,74,.6);animation:pulse 1.2s ease-in-out infinite}
.steps li.done{color:var(--ink)}
.steps li.done::before{border-color:var(--cyan);background:var(--cyan)}
.steps li.bad::before{border-color:var(--bad);background:var(--bad)}
@keyframes pulse{50%{opacity:.35}}
.sbar{height:10px;border:1px solid var(--cyan-dim);background:rgba(25,227,255,.06);overflow:hidden}
.sbar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--mag));transition:width .4s}
.sbar.unknown span{width:30%;animation:slide 1.4s ease-in-out infinite alternate}
@keyframes slide{from{margin-inline-start:0}to{margin-inline-start:70%}}
@media (prefers-reduced-motion:reduce){.steps li.now::before,.sbar.unknown span{animation:none}}

/* scrollbars */
*{scrollbar-color:#2a3a66 transparent;scrollbar-width:thin}
@media (max-width:820px){.stage{border-inline-end:0;border-bottom:1px solid var(--cyan-dim)}}
</style>
</head>
<body>
<div class="app">

  <section class="stage" data-i-aria="stage_aria">
    <div class="morning" id="morning" role="dialog" aria-labelledby="m-title">
      <h2 id="m-title" data-i="morning_h"></h2>
      <ul id="m-list"></ul>
      <div class="row">
        <button class="btn flame" id="m-ok" data-i="ok_btn"></button>
        <button class="btn ghost" id="m-undo" data-i="m_undo"></button>
        <button class="btn ghost" id="m-share" data-i="m_share"></button>
      </div>
      <div id="m-sharebox" hidden>
        <p class="note" data-i="share_pick"></p>
        <div class="picks" id="m-pick"></div>
        <canvas id="m-canvas" width="1080" height="1350" role="img" data-i-aria="share_preview"></canvas>
        <div class="row">
          <button class="btn" id="m-save" data-i="share_save"></button>
          <button class="btn ghost" id="m-native" hidden data-i="share_native"></button>
          <button class="btn ghost" id="m-back" data-i="cancel"></button>
        </div>
      </div>
    </div>

    <canvas id="brain3d" aria-hidden="true" data-i-title="brain_drag"></canvas>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="who"><h1 id="p-name">Eve</h1><p id="p-tag"></p><p class="age" id="p-age"></p></div>
  </section>

  <section class="side">
    <div class="setup" id="setup" hidden role="status" aria-live="polite">
      <div class="setup-box">
        <h2 id="setup-title" data-i="setup_h"></h2>
        <p class="lead" data-i="setup_lead"></p>
        <ol class="steps" id="setup-steps"></ol>
        <div class="sbar" id="setup-bar" hidden><span></span></div>
        <p class="note" id="setup-bytes"></p>
        <div id="setup-err" hidden>
          <p class="note err" id="setup-errmsg"></p>
          <p class="note" id="setup-logs"></p>
          <button class="btn" id="setup-retry" type="button" data-i="setup_retry"></button>
        </div>
      </div>
    </div>
    <header class="top">
      <span class="local" data-i-title="local_title" data-i="local"></span>
      <span class="note" id="mode" style="margin:0"></span>
      <button class="langbtn" id="langbtn" type="button" lang="en">English</button>
      <nav class="tabs" role="tablist">
        <button role="tab" data-v="chat" aria-selected="true" data-i="tab_chat"></button>
        <button role="tab" data-v="brain" aria-selected="false" data-i="tab_brain"></button>
        <button role="tab" data-v="memory" aria-selected="false" data-i="tab_memory"></button>
        <button role="tab" data-v="files" aria-selected="false" data-i="tab_files"></button>
        <button role="tab" data-v="personas" aria-selected="false" data-i="tab_personas"></button>
        <button role="tab" data-v="settings" aria-selected="false" data-i="tab_settings"></button>
      </nav>
    </header>

    <div class="view on" id="v-chat">
      <div class="log" id="log"><p class="empty" id="empty" data-i="empty"></p></div>
      <div class="attached" id="attached" hidden></div>
      <form class="composer" id="form">
        <button class="attach" id="attach" type="button" data-i-aria="attach_aria" data-i-title="attach_aria"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M16.5 6.5l-7.8 7.8a2 2 0 002.8 2.8l8.1-8.1a4 4 0 00-5.7-5.7L5.6 11.6a6 6 0 008.5 8.5l6.4-6.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        <input type="file" id="filepick" hidden multiple accept=".pdf,.docx,.txt,.md,.csv,.json,.html,.htm,.log,.png,.jpg,.jpeg,.webp,.bmp,.gif">
        <textarea id="input" data-i-ph="input_ph" data-i-aria="input_aria" rows="1"></textarea>
        <button class="btn" id="send" data-i="send"></button>
      </form>
    </div>

    <div class="view" id="v-brain">
      <h2 data-i="brain_h"></h2>
      <p class="lead" id="brain-lead"></p>
      <div class="panel" id="rampanel">
        <h3 data-i="ram_h"></h3>
        <div class="bar" id="rambar" role="img"></div>
        <div class="legend"><span><i style="background:var(--ink)"></i><b data-i="leg_skel" style="font-weight:400"></b></span><span><i style="background:var(--flame)"></i><b data-i="leg_core" style="font-weight:400"></b></span><span><i style="background:#ffe59c"></i><b data-i="leg_cache" style="font-weight:400"></b></span><span><i style="background:#e7ebf5"></i><b data-i="leg_disk" style="font-weight:400"></b></span></div>
        <p class="note" id="ramtext"></p>
      </div>
      <div class="panel"><dl class="facts" id="facts"></dl></div>
      <div class="panel">
        <h3 data-i="night_h"></h3>
        <p class="note" id="waiting" style="margin:0 0 10px"></p>
        <div class="row"><button class="btn flame" id="sleep" data-i="sleep_btn"></button><button class="btn ghost" id="undo" data-i="undo_btn"></button></div>
        <p class="note" id="nightmsg"></p>
        <div id="lastnight"></div>
      </div>
    </div>

    <div class="view" id="v-memory">
      <h2 data-i="mem_h"></h2>
      <p class="lead" data-i="mem_lead"></p>
      <form class="row panel" id="memform"><input type="text" id="memtext" data-i-ph="mem_ph" data-i-aria="mem_aria" style="flex:1;min-width:180px"><button class="btn" data-i="save"></button></form>
      <div class="panel"><ul class="plain" id="memlist"></ul></div>
    </div>

    <div class="view" id="v-files">
      <h2 data-i="files_h"></h2>
      <p class="lead" data-i="files_lead"></p>
      <div class="panel drop" id="dropzone">
        <p data-i="drop_here" style="margin:0 0 10px"></p>
        <button class="btn" id="files-add" type="button" data-i="files_add"></button>
        <p class="note" id="files-msg" aria-live="polite"></p>
      </div>
      <div class="panel"><ul class="plain" id="filelist"></ul></div>
      <p class="note" data-i="files_note"></p>
    </div>

    <div class="view" id="v-personas">
      <h2 data-i="per_h"></h2>
      <p class="lead" data-i="per_lead"></p>
      <div class="row" style="margin-bottom:14px"><button class="btn flame" id="new-char" data-i="new_char"></button></div>
      <div class="cards" id="pcards"></div>
      <form class="panel editor" id="editor" hidden>
        <h3 id="ed-title" data-i="design_cta"></h3>
        <p class="note" style="margin:0 0 12px" data-i="ed_note"></p>
        <div class="grid">
          <label class="f"><span data-i="ed_name"></span><input type="text" id="ed-name" maxlength="40" required></label>
          <label class="f"><span data-i="ed_tag"></span><input type="text" id="ed-tag" maxlength="80" data-i-ph="ed_tag_ph"></label>
        </div>
        <label class="f" style="margin-top:10px"><span data-i="ed_pers"></span><textarea id="ed-pers" maxlength="600" rows="3" data-i-ph="ed_pers_ph"></textarea></label>
        <div class="row ed-actions">
          <button class="btn" id="ed-save" type="submit" data-i="ed_save"></button>
          <button class="btn ghost" id="ed-cancel" type="button" data-i="cancel"></button>
          <button class="btn danger" id="ed-del" type="button" hidden data-i="ed_del"></button>
          <span class="note err" id="ed-msg" style="margin:0"></span>
        </div>
      </form>
      <div id="refused"></div>
      <p class="note" style="margin-top:18px" data-i="per_note"></p>
    </div>

    <div class="view" id="v-settings">
      <h2 data-i="set_h"></h2>
      <div class="panel"><h3 data-i="lang_h"></h3>
        <div class="row" role="group" data-i-aria="lang_h"><button class="chip" data-lang="ar" lang="ar" type="button">العربية</button><button class="chip" data-lang="en" lang="en" type="button">English</button></div></div>
      <div class="panel"><h3 data-i="vision_h"></h3><p class="note" style="margin:0 0 10px" data-i="vision_p"></p>
        <div class="row"><button class="btn" id="vision-btn" type="button"></button><span class="note" id="vision-msg" style="margin:0"></span></div></div>
      <div class="panel"><h3 data-i="data_h"></h3><p class="note" style="margin:0" data-i="data_p"></p></div>
      <div class="panel"><h3 data-i="quit_h"></h3><p class="note" style="margin:0 0 10px" data-i="quit_p"></p>
        <button class="btn ghost" id="quit" type="button" data-i="quit_btn"></button></div>
      <div class="panel"><h3 data-i="wipe_h"></h3><p class="note" style="margin:0 0 10px" data-i="wipe_p"></p>
        <div class="row"><button class="btn danger" id="wipe" data-i="wipe_h"></button><span class="note" id="wipemsg" style="margin:0"></span></div></div>
    </div>
  </section>
</div>

let lang = "ar";
try { lang = localStorage.getItem("lang") || ((navigator.language || "").toLowerCase().startsWith("ar") ? "ar" : "en"); } catch (e) {}
if (!I18N[lang]) lang = "en";
const tr = (k, v = {}) => String(I18N[lang][k] ?? I18N.ar[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? "—");
const nameOf = (p) => (lang === "en" && p.name_en) || p.name;
const tagOf = (p) => (lang === "en" ? p.tagline_en : p.tagline) || p.tagline || "";
const holderOf = (p) => p.created_by === "user" ? tr("holder_user") : (lang === "en" && p.rights.holder_en) || p.rights.holder || "";
function applyLang() {
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i]").forEach((e) => { e.textContent = tr(e.dataset.i); });
  document.querySelectorAll("[data-i-ph]").forEach((e) => { e.placeholder = tr(e.dataset.iPh); });
  document.querySelectorAll("[data-i-aria]").forEach((e) => { e.setAttribute("aria-label", tr(e.dataset.iAria)); });
  document.querySelectorAll("[data-i-title]").forEach((e) => { e.title = tr(e.dataset.iTitle); });
  document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  const other = lang === "ar" ? "en" : "ar";
  $("langbtn").textContent = other === "en" ? "English" : "العربية"; $("langbtn").lang = other;
}
function setLang(v) {
  lang = v; try { localStorage.setItem("lang", v); } catch (e) {}
  applyLang();
  if (editing) $("ed-title").textContent = editing.id ? tr("ed_edit", {name: $("ed-name").value}) : tr("design_cta");
  if (state) render();
  if (document.querySelector("#v-memory.on")) loadMem();
}
const log = $("log"), input = $("input");
let curMood = "neutral", editing = null;
let state = null, busy = false, moodTimer = null;
let conv = "default";
try { conv = localStorage.getItem("conv") || ("c" + Date.now()); localStorage.setItem("conv", conv); } catch (e) { conv = "c" + Date.now(); }
const history = [];

const api = async (path, method = "GET", body) => {
  const r = await fetch(path, {method, headers: body ? {"Content-Type": "application/json"} : {}, body: body ? JSON.stringify(body) : undefined});
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).detail || m; } catch (e) {} throw new Error(m); }
  return r.json();
};
const gb = (b) => (b / 1e9).toFixed(2) + " GB";
const pct = (x) => x == null ? "—" : Math.round(x * 100) + "%";
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

// ---------------------------------------------------------------- the brain: the face of the assistant
let brain = null, brainFailed = false;
function ensureBrain() {
  if (brain || brainFailed) return brain;
  brain = createBrain($("brain3d"));
  if (!brain) brainFailed = true;
  else { brain.setMood(curMood); brain.advance(1.5); }
  return brain;
}
function showCharacter() {
  if (brainFailed) return;
  document.body.classList.add("isbrain");          // visible first, so WebGL starts with a real size
  if (!ensureBrain()) document.body.classList.remove("isbrain");
}
function setMood(mood, hold) {
  clearTimeout(moodTimer);
  curMood = mood; brain?.setMood(mood);
  if (hold) moodTimer = setTimeout(() => { if (!state || !state.sleeping) { curMood = "neutral"; brain?.setMood("neutral"); } }, hold);
}
function setTalking(on) { brain?.setTalking(on); }
function setStatus(t) { $("status").textContent = t; }

// ---------------------------------------------------------------- chat
function addMsg(role, text, id) {
  $("empty")?.remove();
  const m = el("div", "msg " + (role === "user" ? "user" : "bot"));
  const b = el("div", "b", text); b.dir = "auto"; m.append(b);
  if (role !== "user") { const a = el("div", "acts"); m.append(a); if (id) fillActs(a, id, b); }
  log.append(m); log.scrollTop = log.scrollHeight;
  return m;
}
function fillActs(a, id, bubble) {
  a.replaceChildren();
  const ok = el("button", "", tr("ok")), fix = el("button", "", tr("fix"));
  ok.onclick = async () => { await api("/api/feedback", "POST", {message_id: id, action: "approve"}); a.replaceChildren(el("span", "saved", tr("saved_ok"))); setMood("happy", 2500); refresh(); };
  fix.onclick = () => {
    const box = el("div", "fix"), ta = el("textarea"), row = el("div", "row");
    ta.placeholder = tr("fix_ph"); ta.setAttribute("aria-label", tr("fix_aria"));
    const save = el("button", "btn", tr("fix_save")), cancel = el("button", "btn ghost", tr("cancel"));
    save.onclick = async () => {
      if (!ta.value.trim()) { ta.focus(); return; }
      await api("/api/feedback", "POST", {message_id: id, action: "correct", correction: ta.value.trim()});
      a.replaceChildren(el("span", "saved", tr("saved_fix"))); refresh();
    };
    cancel.onclick = () => fillActs(a, id, bubble);
    row.append(save, cancel); box.append(ta, row); a.replaceChildren(box); ta.focus();
  };
  a.append(ok, fix);
}

async function send(text) {

function reportLines(r) {
  const out = [];
  const L = r.learning || {}, C = r.core || {};
  if (L.mode === "memory") {
    const n = (L.new_memories || []).length;
    if (!L.messages_read) out.push(tr("r_none"));
    else if (n) {
      out.push(tr("r_saved", {n: L.messages_read, k: n}));
      L.new_memories.slice(0, 4).forEach((t) => out.push(t));
    } else out.push(tr("r_nothing", {n: L.messages_read}));
  }
  if (L.skipped) out.push(tr("r_skipped"));
  else if (L.accepted) {
    out.push(tr("r_learned", {n: L.new_examples, c: L.corrections}));
    (L.samples || []).slice(0, 2).forEach((s) => out.push(tr("r_example") + s));
    out.push(tr("r_passed"));
  } else if (L.reasons) out.push(tr("r_failed"));
  if (C.coverage_after != null) {
    out.push(tr("r_core", {a: pct(C.coverage_after), b: pct(C.coverage_before), s: C.swapped}));
  }

}

function wrapLines(ctx, text, width, max) {
  const words = text.split(/\s+/).filter(Boolean), lines = []; let line = "", used = 0;
  for (const w of words) {
    const t = line ? line + " " + w : w;
    if (ctx.measureText(t).width > width && line) {
      lines.push(line); line = w;
      if (lines.length === max) { line = ""; break; }
    } else line = t;
    used++;
  }
  if (line && lines.length < max) lines.push(line);
  if (used < words.length) lines[lines.length - 1] = lines[lines.length - 1].replace(/\s*\S*$/, "") + "…";
  return lines;
}

  const list = await api("/api/files"), ul = $("filelist");
  attached = attached.filter((a) => list.some((f) => f.id === a.id)); saveAttached();
  const kinds = {pdf: "PDF", docx: "Word", text: tr("kind_text"), image: tr("kind_image")};
  ul.replaceChildren(...(list.length ? list.map((f) => {
    const li = el("li"), info = el("span"), row = el("div", "row");
    if (f.has_image) { const im = el("img", "thumb big"); im.src = "/api/files/" + f.id + "/image"; im.alt = ""; li.append(im); }
    info.append(el("b", "", f.name), el("span", "meta", tr("file_meta", {kind: kinds[f.kind] || f.kind,
      n: Math.max(1, Math.round(f.chars / 1000)).toLocaleString("en-US"), date: new Date(f.created * 1000).toLocaleDateString(lang === "ar" ? "ar-u-nu-latn" : "en")})));
    const on = attached.some((a) => a.id === f.id);
    const use = el("button", "chip", on ? tr("f_used") : tr("f_use")); use.setAttribute("aria-pressed", on);
    use.onclick = () => { attached = on ? attached.filter((a) => a.id !== f.id) : [...attached, {id: f.id, name: f.name, image: f.has_image}]; saveAttached(); loadFiles(); };
    const del = el("button", "chip", tr("f_del"));
    del.onclick = async () => { await api("/api/files/" + f.id, "DELETE"); attached = attached.filter((a) => a.id !== f.id); saveAttached(); loadFiles(); refresh(); };
    row.append(use, del); li.append(info, row); return li;
  }) : [el("li", "note", tr("files_empty"))]));
}
$("attach").onclick = () => $("filepick").click();
$("filepick").onchange = (e) => { const f = [...e.target.files]; e.target.value = ""; addFiles(f, !document.querySelector("#v-files.on")); };
$("files-add").onclick = () => $("filepick").click();
function dropTarget(zone, attach) {
  zone.addEventListener("dragover", (e) => { if ([...e.dataTransfer.types].includes("Files")) { e.preventDefault(); zone.classList.add("dropping"); } });
  zone.addEventListener("dragleave", (e) => { if (!zone.contains(e.relatedTarget)) zone.classList.remove("dropping"); });
  zone.addEventListener("drop", (e) => { e.preventDefault(); zone.classList.remove("dropping"); addFiles([...e.dataTransfer.files], attach); });
}
dropTarget($("v-chat"), true); dropTarget($("dropzone"), false);
input.addEventListener("paste", (e) => {
  const files = [...(e.clipboardData?.files || [])];
  if (!files.length) return;                              // plain text paste behaves normally
  e.preventDefault();
  const named = files.map((f) => f.name ? f : new File([f], "image-" + Date.now() + "." + ((f.type.split("/")[1] || "png").replace("jpeg", "jpg")), {type: f.type}));
  addFiles(named, true);
});
renderAttached();

// ---------------------------------------------------------------- vision (see images)
let visionBusy = false;
function renderVision(brain) {
  const on = !!(brain && brain.vision);
  const btn = $("vision-btn");
  btn.textContent = visionBusy ? tr("vision_switching") : on ? tr("vision_off_btn") : tr("vision_on_btn");
  btn.disabled = visionBusy || !!(brain && brain.setup);
  btn.className = on ? "btn ghost" : "btn";
  $("vision-msg").textContent = on ? tr("vision_is_on") : "";
}
$("vision-btn").onclick = async () => {
  const on = !!(state?.brain?.vision);
  if (!on && !confirm(tr("vision_confirm"))) return;
  visionBusy = true; renderVision(state?.brain);
  try { await api("/api/vision", "POST", {on: !on}); } catch (e) { $("vision-msg").textContent = e.message; }
  visionBusy = false;
  setTimeout(refresh, 500);
};

// ---------------------------------------------------------------- memory
async function loadMem() {
  const list = await api("/api/memories"), ul = $("memlist");
  ul.replaceChildren(...(list.length ? list.map((m) => {
    const li = el("li"), del = el("button", "btn ghost", tr("delete"));
    del.onclick = async () => { await api("/api/memories/" + m.id, "DELETE"); loadMem(); };
    li.append(el("span", "", m.text), del); return li;
  }) : [el("li", "note", tr("mem_empty"))]));
}
$("memform").addEventListener("submit", async (e) => { e.preventDefault(); const t = $("memtext").value.trim(); if (!t) return; await api("/api/memories", "POST", {text: t}); $("memtext").value = ""; loadMem(); });

// wipe: two-step button instead of a browser dialog
let armed = false;
$("wipe").onclick = async () => {
  if (!armed) { armed = true; $("wipe").textContent = tr("sure"); setTimeout(() => { armed = false; $("wipe").textContent = tr("wipe_h"); }, 5000); return; }
  armed = false; $("wipe").textContent = tr("wipe_h");
  await api("/api/wipe", "POST"); history.length = 0; log.replaceChildren(); $("wipemsg").textContent = tr("wiped"); refresh();
};

// ---------------------------------------------------------------- characters: a name and a way of talking
function openEditor(p) {
  editing = { id: p?.id || null };
  $("ed-title").textContent = p ? tr("ed_edit", {name: p.name}) : tr("design_cta");
  $("ed-name").value = p?.name || ""; $("ed-tag").value = p?.tagline || ""; $("ed-pers").value = p?.personality || "";
  $("ed-del").hidden = !p; $("ed-msg").textContent = "";
  $("editor").hidden = false; $("pcards").hidden = true; $("new-char").hidden = true;
  $("ed-name").focus();
}
function closeEditor() {
  editing = null; $("editor").hidden = true; $("pcards").hidden = false; $("new-char").hidden = false;
  setTalking(false); setMood("neutral"); refresh();
}
$("ed-name").addEventListener("input", () => { if (editing) $("p-name").textContent = $("ed-name").value.trim() || tr("design_cta"); });
$("ed-tag").addEventListener("input", () => { if (editing) $("p-tag").textContent = $("ed-tag").value.trim(); });
$("new-char").onclick = () => openEditor(null);
$("ed-cancel").onclick = closeEditor;
let delArmed = false;
$("ed-del").onclick = async () => {
  if (!delArmed) { delArmed = true; $("ed-del").textContent = tr("sure"); setTimeout(() => { delArmed = false; $("ed-del").textContent = tr("ed_del"); }, 5000); return; }
  delArmed = false; $("ed-del").textContent = tr("ed_del");
  await api("/api/personas/" + editing.id, "DELETE"); closeEditor();
};
$("editor").addEventListener("submit", async (e) => {
  e.preventDefault();
  const body = { name: $("ed-name").value.trim(), tagline: $("ed-tag").value.trim(), personality: $("ed-pers").value.trim() };
  if (!body.name) { $("ed-msg").textContent = tr("need_name"); $("ed-name").focus(); return; }
  try {
    const r = editing.id ? await api("/api/personas/" + editing.id, "PUT", body) : await api("/api/personas", "POST", body);
    if (!editing.id) await api("/api/persona", "POST", { id: r.id });
    closeEditor(); setMood("happy", 3000);
  } catch (err) { $("ed-msg").textContent = tr("not_saved") + err.message; }
});

document.querySelectorAll("[data-lang]").forEach((b) => b.onclick = () => setLang(b.dataset.lang));
$("langbtn").onclick = () => setLang(lang === "ar" ? "en" : "ar");
applyLang();

(async () => {
  await refresh();
  try { (await api("/api/history?conv=" + encodeURIComponent(conv))).forEach((m) => { addMsg(m.role, m.content, m.role === "assistant" && !m.status ? m.id : null); history.push({role: m.role, content: m.content}); }); } catch (e) {}
})();
</script>
</body>
