<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"/web/vendor/three.module.min.js"}}</script>
<style>
html,body{margin:0;width:1280px;height:640px;overflow:hidden;background:#05060d}
body{font-family:"Inter","Segoe UI",system-ui,sans-serif;color:#fff}
#bg{position:absolute;inset:0;background:radial-gradient(45% 70% at 74% 50%,#2a1460 0%,#0d0b26 55%,#05060d 100%)}
#bg::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(25,227,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(25,227,255,.05) 1px,transparent 1px);background-size:40px 40px}
#bg::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(rgba(255,255,255,.02) 0 1px,transparent 1px 3px)}
.br{position:absolute;width:44px;height:44px;border:0 solid}
.a{top:26px;left:26px;border-top-width:4px;border-left-width:4px;border-color:#19e3ff}
.b{top:26px;right:26px;border-top-width:4px;border-right-width:4px;border-color:#ff2bd6}
.c{bottom:26px;left:26px;border-bottom-width:4px;border-left-width:4px;border-color:#ff2bd6}
.d{bottom:26px;right:26px;border-bottom-width:4px;border-right-width:4px;border-color:#19e3ff}
#b{position:absolute;right:-10px;top:0;width:700px;height:640px}
.txt{position:absolute;left:96px;top:150px;width:600px}
h1{margin:0;font-size:150px;line-height:1;font-weight:800;letter-spacing:-.01em;text-shadow:0 0 40px rgba(25,227,255,.8),0 0 110px rgba(25,227,255,.3)}
p{margin:22px 0 0;font-size:36px;line-height:1.3;font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}

  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
