name: Windows installer

on:
  push:
    branches: [main]
    paths: ["pcore/**", "web/**", "personas/**", "installer/**", "requirements-app.txt", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          if (Test-Path $nsis) { Add-Content $env:GITHUB_PATH $nsis }

      - name: Build the installer
        run: python installer/build_windows.py --version 0.1.0

      - name: Install, use and uninstall Eve
        env:
          PYTHONIOENCODING: utf-8
        run: python installer/windows_smoke_test.py dist/Eve-Setup-0.1.0.exe report

      - name: Publish the nightly build and the test report
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f nightly
          git push -f origin nightly
          $files = @("report/windows-test-report.md")
          foreach ($f in @("dist/Eve-Setup-0.1.0.exe", "report/eve-on-windows.png", "report/app.log", "report/llama-server.log")) { if (Test-Path $f) { $files += $f } }
          gh release view nightly *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create nightly --prerelease --title "Nightly build" --notes "Built and tested on Windows by GitHub Actions on every change. See windows-test-report.md."
          }
          gh release upload nightly $files --clobber
