name: Windows installer

on:
  push:
    branches: [main]
    paths: ["pcore/**", "web/**", "personas/**", "installer/**", "requirements-app.txt", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Ubuntu's NSIS has the 64-bit installer stubs; the Windows NSIS download does not.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y -q nsis
      - run: python installer/build_windows.py --version 0.1.0
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/Eve-Setup-0.1.0.exe

  test-on-windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: dist
      - name: Install, use and uninstall Eve
        env:
          PYTHONIOENCODING: utf-8
        run: python installer/windows_smoke_test.py dist/Eve-Setup-0.1.0.exe report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report
          path: report

  publish:
    needs: [build, test-on-windows]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish the nightly build and the test report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f nightly
          git push -f origin nightly
          files="out/installer/Eve-Setup-0.1.0.exe"
          for f in out/report/windows-test-report.md out/report/eve-on-windows.png out/report/app.log out/report/llama-server.log; do
            [ -f "$f" ] && files="$files $f"
          done
          gh release view nightly >/dev/null 2>&1 || gh release create nightly --prerelease --title "Nightly build" \
            --notes "Built on every change and tested on Windows by GitHub Actions. See windows-test-report.md."
          gh release upload nightly $files --clobber
